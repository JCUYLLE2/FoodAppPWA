<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodApp - A Social App for Foodies</title>

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Your kitchen, their likes. Connect with food lovers and share your favorite recipes!">
  <meta name="keywords" content="Food, Recipes, Social Media, Cooking, Foodie, FoodApp">
  <meta name="author" content="FoodApp Team">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="FoodApp - A Social App for Foodies">
  <meta property="og:description" content="Connect with food lovers worldwide. Share, like, and explore new recipes!">
  <meta property="og:image" content="/assets/icons/icon-512x512.png">
  <meta property="og:url" content="https://yourdomain.com/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FoodApp - A Social App for Foodies">
  <meta name="twitter:description" content="Your kitchen, their likes. A place to connect with food enthusiasts!">
  <meta name="twitter:image" content="/assets/icons/icon-512x512.png">

  <!-- Favicon and App Icons -->
  <link rel="icon" href="/assets/icons/icon-192x192.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Theme Colors for Mobile -->
  <meta name="theme-color" content="#ff6347">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- iOS Splash Screens -->
  <link rel="apple-touch-startup-image" href="/assets/splash/splash-640x1136.png" media="(device-width: 320px)">
  <link rel="apple-touch-startup-image" href="/assets/splash/splash-750x1334.png" media="(device-width: 375px)">
  <link rel="apple-touch-startup-image" href="/assets/splash/splash-1125x2436.png"
    media="(device-width: 375px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="/assets/splash/splash-1242x2688.png"
    media="(device-width: 414px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="/assets/splash/splash-828x1792.png"
    media="(device-width: 414px) and (-webkit-device-pixel-ratio: 2)">
</head>


<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
